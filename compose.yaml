services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: jobs
      MYSQL_USER: jobs
      MYSQL_PASSWORD: jobs_dev
      MYSQL_ROOT_PASSWORD: root_dev_only
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql_data:
