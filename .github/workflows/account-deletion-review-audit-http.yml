name: U01 isolated manual deletion review audit HTTP E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  review-audit-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_only
          MYSQL_DATABASE: account_review_audit_ci
          MYSQL_USER: ci_test
          MYSQL_PASSWORD: ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DATABASE_URL: mysql://ci_test:ci_only@127.0.0.1:3306/account_review_audit_ci
      INTEGRATION_TEST_DATABASE: "true"
      ACCOUNT_REVIEW_HTTP_PORT: "3105"
      TRUSTED_CLIENT_IP_HEADER: "x-real-ip"
      ENABLE_REAL_PAYMENT: "false"
      ENABLE_MOCK_PAYMENT: "false"
      ENABLE_TOOL_PAYMENTS: "false"
      ENABLE_LIVE_AI: "false"
      ENABLE_PAYMENT_RECONCILIATION: "false"
      ENABLE_REFUND_SEND: "false"
      ENABLE_REFUND_QUERY: "false"
      ENABLE_REFUND_DISPATCH_CLAIM: "false"
      ENABLE_EMAIL_VERIFICATION_DELIVERY: "false"
      ENABLE_PASSWORD_RESET_DELIVERY: "false"
      # Only this disposable CI may record synthetic audit events.
      ENABLE_ACCOUNT_DELETION_REVIEW_WRITE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - run: npm run build
      - name: Verify role, CSRF, idempotence and evidence preservation over HTTP
        run: |
          node node_modules/next/dist/bin/next start -H 127.0.0.1 -p 3105 > /tmp/account-review-http.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          node scripts/ci-account-deletion-review-audit-http.mjs
